<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Almoxarifado</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="script.js" defer></script>
</head>

<body class="bg-blue-100 min-h-screen">

<!-- LOGIN -->
<section id="loginSection" class="min-h-screen flex items-center justify-center">

    <form id="loginForm"
          class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

        <h1 class="text-2xl font-bold text-center mb-6">
            Gestão Almoxarifado
        </h1>

        <input id="username"
               name="username"
               type="email"
               placeholder="E-mail"
               required
               class="w-full border p-3 rounded-lg mb-4">

        <input id="password"
               name="password"
               type="password"
               placeholder="Senha"
               required
               class="w-full border p-3 rounded-lg mb-4">

        <div id="loginAlert"
             class="hidden bg-red-100 text-red-600 p-3 rounded mb-4">
            <span id="loginAlertMsg"></span>
        </div>

        <button class="w-full bg-blue-600 text-white p-3 rounded-lg">
            Entrar
        </button>

    </form>
</section>


<!-- SISTEMA -->
<section id="navSection" class="hidden">

    <!-- MENU -->
    <nav class="bg-white shadow p-4 flex gap-3">

        <button onclick="showSection('dashboard')"
                class="px-4 py-2 bg-blue-600 text-white rounded">
            Dashboard
        </button>

        <button onclick="showSection('products')"
                class="px-4 py-2 bg-blue-600 text-white rounded">
            Produtos
        </button>

        <button onclick="showSection('movements')"
                class="px-4 py-2 bg-blue-600 text-white rounded">
            Movimentações
        </button>

        <button onclick="logout()"
                class="px-4 py-2 bg-red-500 text-white rounded">
            Sair
        </button>

    </nav>


    <main class="max-w-6xl mx-auto p-6">


        <!-- DASHBOARD -->
        <section id="dashboard">

            <h2 class="text-2xl font-bold mb-6">
                Dashboard
            </h2>

            <div class="grid md:grid-cols-4 gap-4 mb-8">

                <div class="bg-white p-5 rounded-xl shadow">
                    <p>Produtos</p>
                    <strong id="DashProdutos" class="text-3xl">0</strong>
                </div>

                <div class="bg-white p-5 rounded-xl shadow">
                    <p>Estoque baixo</p>
                    <strong id="DashEstoqueBaixo" class="text-3xl">0</strong>
                </div>

                <div class="bg-white p-5 rounded-xl shadow">
                    <p>Entradas</p>
                    <strong id="DashEntradas" class="text-3xl">0</strong>
                </div>

                <div class="bg-white p-5 rounded-xl shadow">
                    <p>Saídas</p>
                    <strong id="DashSaidas" class="text-3xl">0</strong>
                </div>

            </div>

            <div class="bg-white rounded-xl shadow overflow-auto">

                <table class="w-full">

                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-3 text-left">Produto</th>
                            <th class="p-3 text-left">Tipo</th>
                            <th class="p-3 text-left">Quantidade</th>
                            <th class="p-3 text-left">Usuário</th>
                            <th class="p-3 text-left">Data</th>
                        </tr>
                    </thead>

                    <tbody id="DashTableMovs"></tbody>

                </table>

            </div>

        </section>


        <!-- PRODUTOS -->
        <section id="products" class="hidden">

            <div class="flex justify-between mb-6">

                <h2 class="text-2xl font-bold">
                    Produtos
                </h2>

                <button onclick="showProductForm()"
                        class="bg-blue-600 text-white px-4 py-2 rounded">
                    + Produto
                </button>

            </div>


            <!-- CADASTRO -->
            <div id="productForm"
                 class="hidden bg-white p-6 rounded-xl shadow mb-6">

                <h3 class="text-xl font-bold mb-4">
                    Novo Produto
                </h3>

                <form id="newProductForm">

                    <div class="grid md:grid-cols-2 gap-4">

                        <input id="productSku"
                               placeholder="SKU"
                               required
                               class="border p-3 rounded">

                        <input id="productName"
                               placeholder="Nome"
                               required
                               class="border p-3 rounded">

                        <select id="productCategory"
                                required
                                class="border p-3 rounded">
                            <option value="">Categoria</option>
                            <option value="1">Caixas de Papelão</option>
                            <option value="2">Frascos Plásticos</option>
                            <option value="3">Insumos de Lacre</option>
                        </select>

                        <input id="productWeight"
                               type="number"
                               step="0.001"
                               min="0"
                               placeholder="Peso (kg)"
                               required
                               class="border p-3 rounded">

                        <input id="productInitialStock"
                               type="number"
                               min="0"
                               value="0"
                               placeholder="Estoque inicial"
                               class="border p-3 rounded">

                        <input id="productMinStock"
                               type="number"
                               min="0"
                               value="10"
                               placeholder="Estoque mínimo"
                               class="border p-3 rounded">

                    </div>

                    <textarea id="productSpecifications"
                              placeholder="Especificações"
                              class="border p-3 rounded w-full mt-4"></textarea>

                    <div class="mt-4 flex gap-2">

                        <button class="bg-blue-600 text-white px-4 py-2 rounded">
                            Salvar
                        </button>

                        <button type="button"
                                onclick="hideProductForm()"
                                class="bg-gray-300 px-4 py-2 rounded">
                            Cancelar
                        </button>

                    </div>

                </form>

            </div>


            <!-- BUSCA -->
            <input id="productSearch"
                   placeholder="Pesquisar produto ou SKU..."
                   class="w-full border p-3 rounded-lg mb-4">


            <!-- TABELA -->
            <div class="bg-white rounded-xl shadow overflow-auto">

                <table class="w-full">

                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-3 text-left">SKU</th>
                            <th class="p-3 text-left">Produto</th>
                            <th class="p-3 text-left">Categoria</th>
                            <th class="p-3 text-left">Estoque</th>
                            <th class="p-3 text-left">Mínimo</th>
                            <th class="p-3">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="productsTable"></tbody>

                </table>

            </div>


            <!-- EDIÇÃO -->
            <div id="editProductSection"
                 class="hidden bg-white p-6 rounded-xl shadow mt-6">

                <h3 class="text-xl font-bold mb-4">
                    Editar Produto
                </h3>

                <form id="editProductForm">

                    <input type="hidden" id="editProductId">

                    <div class="grid md:grid-cols-2 gap-4">

                        <input id="editProductSku"
                               placeholder="SKU"
                               required
                               class="border p-3 rounded">

                        <input id="editProductName"
                               placeholder="Nome"
                               required
                               class="border p-3 rounded">

                        <select id="editProductCategory"
                                required
                                class="border p-3 rounded">
                                <option value="">Categoria</option>
                            <option value="1">Caixas de Papelão</option>
                            <option value="2">Frascos Plásticos</option>
                            <option value="3">Insumos de Lacre</option>
                        </select>

                        <input id="editProductWeight"
                               type="number"
                               step="0.001"
                               class="border p-3 rounded">

                        <input id="editProductCurrentStock"
                               readonly
                               class="border p-3 rounded bg-gray-100">

                        <input id="editProductMinStock"
                               type="number"
                               min="0"
                               class="border p-3 rounded">

                    </div>

                    <textarea id="editProductSpecifications"
                              class="border p-3 rounded w-full mt-4"></textarea>

                    <div class="mt-4">

                        <button class="bg-blue-600 text-white px-4 py-2 rounded">
                            Salvar
                        </button>

                        <button type="button"
                                onclick="hideEditProductForm()"
                                class="bg-gray-300 px-4 py-2 rounded">
                            Cancelar
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- MOVIMENTAÇÕES -->
        <section id="movements" class="hidden">

            <h2 class="text-2xl font-bold mb-6">
                Movimentações
            </h2>


            <form id="movementForm"
                  class="bg-white p-6 rounded-xl shadow mb-6">

                <div class="grid md:grid-cols-2 gap-4">

                    <select id="movementProduct"
                            required
                            class="border p-3 rounded">
                        <option value="">Produto</option>
                    </select>

                    <select id="movementType"
                            required
                            class="border p-3 rounded">
                        <option value="">Tipo</option>
                        <option value="ENTRADA">Entrada</option>
                        <option value="SAIDA">Saída</option>
                    </select>

                    <input id="movementQuantity"
                           type="number"
                           min="1"
                           placeholder="Quantidade"
                           required
                           class="border p-3 rounded">

                    <input id="movementObservation"
                           placeholder="Observação"
                           class="border p-3 rounded">

                </div>

                <button class="bg-blue-600 text-white px-4 py-2 rounded mt-4">
                    Registrar movimentação
                </button>

            </form>


            <div class="bg-white rounded-xl shadow overflow-auto">

                <table class="w-full">

                    <thead class="bg-gray-100">

                        <tr>
                            <th class="p-3">Data</th>
                            <th class="p-3">Produto</th>
                            <th class="p-3">SKU</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Quantidade</th>
                            <th class="p-3">Usuário</th>
                            <th class="p-3">Observação</th>
                        </tr>

                    </thead>

                    <tbody id="movementsTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</section>

</body>
</html>
